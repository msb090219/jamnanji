<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">Three voltage phasor directions with current rightward; anticlockwise is a phase lead</title><rect width="640" height="360" fill="#fffdf4"/><style>text{font:16px Arial,sans-serif;fill:#172d35}.small{font-size:13px}path,line,polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" style="fill:#172d35"/></marker></defs><text x="40" y="30">Anticlockwise rotation represents increasing phase</text><path id="phasor-p" d="M300 180H490" stroke="#172d35" stroke-width="3" marker-end="url(#arrow)"/><path id="phasor-q" d="M300 180V60" stroke="#172d35" stroke-width="3" marker-end="url(#arrow)"/><path id="phasor-s" d="M300 180V300" stroke="#172d35" stroke-width="3" marker-end="url(#arrow)"/><text x="503" y="184">P</text><text x="310" y="60">Q</text><text x="310" y="307">S</text><path d="M90 180H235" stroke="#006b70" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="65" y="160">Current reference</text><text x="155" y="343" class="small">Directions show phase; lengths are not to scale.</text></svg>
